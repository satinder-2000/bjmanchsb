<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <!-- link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css"/-->
    </head>
    <body>

    <body>

        <div th:fragment="head">
        <!-- Navbar -->
		<div class="w3-bar w3-black">
			<span th:if="${session.loggedInUser == null}"><a href="#" class="w3-bar-item w3-button" th:href="@{/login}">Log In</a></span>
			<span th:if="${session.loggedInUser != null}"><a href="#" class="w3-bar-item w3-button" th:href="@{/logout}">Log Out</a></span>
			<span th:if="${isUserLoggedIn}"><a href="#" class="w3-bar-item w3-button" th:href="@{/logout}">Log Out</a></span>
			<a href="#" class="w3-bar-item w3-button" th:href="@{/registerUser}">Register</a>
			<div class="w3-bar-item w3-right">Profile</div>
		</div>
	</div>

    </body>
</html>
