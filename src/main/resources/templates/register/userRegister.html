<!DOCTYPE html>
<html lang="en" xmlns:th="http://www/thymeleaf.org">
    <head>
        <title>User Register</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
        <link rel="stylesheet" href="https://www.w3schools.com/lib/w3-theme-blue-grey.css">
		<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
		<style>
		html, body, h1, h2, h3, h4, h5 {
			font-family: "Open Sans", sans-serif
		}
		</style>
		<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
		<script>
 		
$(document).ready(function () {

    $("#stateCd").on("change", function () {

        // Get the selected state code, for example RJ
        var stateCode = $(this).val();

        // Clear both dropdowns
        $("#lokSabha").empty();
        $("#vidhanSabha").empty();

        // Add default options
        $("#lokSabha").append(
            $("<option></option>")
                .val("")
                .text("-- Select Lok Sabha --")
        );

        $("#vidhanSabha").append(
            $("<option></option>")
                .val("")
                .text("-- Select Vidhan Sabha --")
        );

        // Stop if no state has been selected
        if (!stateCode) {
            return;
        }

        // AJAX call 1: Fetch Lok Sabha constituencies
        $.ajax({
            url: "/stateLokSabhas/" + encodeURIComponent(stateCode),
            type: "GET",
            dataType: "json",

            success: function (constituencies) {

                $.each(constituencies, function (index, item) {

                    $("#lokSabha").append(
                        $("<option></option>")
                            .val(item.constituency)
                            .text(item.constituency)
                    );

                });

            },

            error: function (xhr, status, error) {
                console.error("Lok Sabha API error:", error);
            }
        });

        // AJAX call 2: Fetch Vidhan Sabha constituencies
        $.ajax({
            url: "/stateVidhanSabhas/" + encodeURIComponent(stateCode),
            type: "GET",
            dataType: "json",

            success: function (constituencies) {

                $.each(constituencies, function (index, item) {

                    $("#vidhanSabha").append(
                        $("<option></option>")
                            .val(item.constituency)
                            .text(item.constituency)
                    );

                });

            },

            error: function (xhr, status, error) {
                console.error("Vidhan Sabha API error:", error);
            }
        });

    });

});

$("#dob").datepicker({
                dateFormat: "dd/mm/yy"
            });
 				
		</script>
	</head>
    <body>
    	<!-- Navigation /header -->
    	<div  class="w3-container w3-round-large">
    		<div class="w3-panel">
    			<div th:insert="~{fragments/header::head}" ></th:insert>
    			</div>
    		</div>
         </div>
        <!-- Navigation /header -->


        <!-- Central Part / Left Content and Right stuff -->
        <div class="w3-container w3-content" style="max-width:1400px;margin-top:10px">    
            <!-- The Grid -->
            <div class="w3-row">
                <!-- Left Column -->
                <div class="w3-col m2">
                Left Column
                </div>
                <!-- End Left Column -->
                <!-- Central Part -->
             	<div class="w3-col m8">
                <h2>User Registration</h2>
                <form th:action="@{/registerUser}" method="post" enctype="multipart/form-data" th:object=${userDto}>
                <table class="w3-table">
                <tr>
                <td><label for="email">Email:</label></td>
                <td><input id="email" type="text" th:field="*{email}" placeholder="Email"/>
                	<span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red;font-size:.8em"></span>
                </td>
                </tr>
                <tr>
                <td><label for="firstName">First Name:</label></td>
                <td><input id="firstName" type="text" th:field="*{firstName}" placeholder="First Name"/>
                <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" style="color:red;font-size:.8em"></span>
                </td>
                </tr>
                
                <tr>
                <td><label for="lastName">Last Name:</label></td>
                <td><input id="lastName" type="text" th:field="*{lastName}" placeholder="Last Name"/>
                <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" style="color:red;font-size:.8em"></span>
                </td>
                </tr>
                
                <tr>
                <td><label for="gender">Gender:</label></td>
                <td>
                <select id="gender" th:field="*{gender}">
                	<option value="&nbsp;">Select One</option>
					<option th:value="'Male'" th:text="Male"></option>
					<option th:value="'Female'" th:text="Female"></option>
				</select>
				<span th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}" style="color:red;font-size:.8em"></span>
				</td>
                </tr>
                
                <tr>
                <td><label for="dob">Date of Birth:</label></td>
                <td><input id="dob" type="text" th:field="*{dob}" placeholder="DD/MM/YYYY"/>
                <span th:if="${#fields.hasErrors('dob')}" th:errors="*{dob}" style="color:red;font-size:.8em"></span>
                </td>
                </tr>
                
                <tr>
                <td><label for="mobile">Mobile Number:</label></td>
                <td><input id="mobile" type="text" th:field="*{mobile}" placeholder="Valid Mobile Number"/>
                <span th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}" style="color:red;font-size:.8em"></span>
                </td>
                </tr>
                
                <tr>
                <td><span>OR</span></td>
                <td>&nbsp;</td>
                </tr>
                
                <tr>
                <td><label for="phone">Phone/Land line Number:</label></td>
                <td><input id="phone" type="text" th:field="*{phone}" placeholder="Valid Phone/Landline Number"/>
                	<span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" style="color:red;font-size:.8em"></span>
                </td>
                </tr>
                
                <tr>
                <td><label for="profile">Profile File:</label></td>
                <td><input id="profile" type="file" th:field="*{profileFile}"/><br/>
                	<span style="font-size:.8em">The profile file size must be &lt;500kb</span>
                </td>
                </tr>
                
                <tr>
                <td><label for="stateCd">State:</label></td>
                <td><select id="stateCd" th:field="*{stateCode}">
                	<option value="&nbsp;">Select One</option>
                	<option th:each="stateDto : *{stateDtos}" th:value="${stateDto.code}" th:text="${stateDto.name}"></option>
                </select>
                <span th:if="${#fields.hasErrors('stateCode')}" th:errors="*{stateCode}" style="color:red;font-size:.8em"></span>
                </td>
                </tr>
                
                <tr>
                <td><label for="lokSabha">Lok Sabha:</label></td>
                <td><select id="lokSabha" th:field="*{lokSabhaConstituency}">
                	<option value="&nbsp;">Select One</option>
                </select>
                <span th:if="${#fields.hasErrors('lokSabhaConstituency')}" th:errors="*{lokSabhaConstituency}" style="color:red;font-size:.8em"></span>
                </td>
                </tr>
                
                <tr>
                <td><label for="vidhanSabha">Vidhan Sabha:</label></td>
                <td><select id="vidhanSabha" th:field="*{vidhanSabhaConstituency}">
                	<option value="&nbsp;">Select One</option>
                </select>
                <span th:if="${#fields.hasErrors('vidhanSabhaConstituency')}" th:errors="*{vidhanSabhaConstituency}" style="color:red;font-size:.8em"></span>
                </td>
                </tr>
                <tr>
                <td>&nbsp;</td>
                <td>
                <button type="submit">Continue</button>
                </td>
                </tr>
                
                </table>
				</form>
				</div>
				<!-- End Central Part -->
                <!-- Right Part -->
             <div class="w3-col m2">
             Right Column
             </div>
                <!-- End Right Part -->
                
                
             </div>

        </div>
        <br>

        


    </body>
</html>
