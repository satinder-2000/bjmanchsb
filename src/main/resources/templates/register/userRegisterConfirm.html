<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>BJManch - User Register - Confirm</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="w3-theme-l5">
    <div th:insert="~{header :: head}">
    </div>
    <!-- Page Container -->
        <div class="w3-container w3-content" style="max-width:1400px;margin-top:10px">    
            <!-- The Grid -->
            <div class="w3-row">
                <!-- Left Column -->
                <div th:insert="~{left :: copy}">
                </div>
                <div class="w3-col m7">
                    <div class="w3-row-padding">
                        <div class="w3-col m12">
                            <div class="w3-card w3-round w3-white">
                                <div class="w3-container w3-padding">
                                    <form th:action="@{/registerUser}" th:object="${userDto}" method="post" enctype="multipart/form-data"> 
                                        <h4 class="w3-margin-left">User Register - Confirm</h4>
                                        <div class="w3-row-padding" style="margin:0 -16px">
                                            <div class="w3-half">
                                                <label for="email" class="w3-margin-left w3-margin-bottom">Email</label>
                                            </div>
                                            <div class="w3-half">
                                                <input type="text" class="w3-input w3-border" th:field="*{email}" disabled="true"/>
                                            </div>        
                                        </div>
                                        <br/>
                                        <div class="w3-row-padding" style="margin:0 -16px">
                                            <div class="w3-half">
                                                <label for="fname" class="w3-margin-left w3-margin-bottom">First Name</label>
                                            </div>
                                            <div class="w3-half">
                                                <input type="text" class="w3-input w3-border" th:field="*{firstName}" disabled="true"/>
                                            </div>        
                                        </div>
                                        <br/>
                                        <div class="w3-row-padding" style="margin:0 -16px">
                                            <div class="w3-half">
                                                <label for="lname" class="w3-margin-left w3-margin-bottom">Last Name</label>
                                            </div>
                                            <div class="w3-half">
                                                <input id="lname" type="text" class="w3-input w3-border" th:field="*{lastName}" disabled="true"/>
                                            </div>        
                                        </div>
                                        <br/>
                                        <div class="w3-row-padding" style="margin:0 -16px">
                                            <div class="w3-half">
                                                <label for="gender" class="w3-margin-left w3-margin-bottom">Gender</label>
                                            </div>
                                            <div class="w3-half">
                                                <input id="gender" type="text" class="w3-input w3-border" th:field="*{gender}" disabled="true"/>
                                            </div>        
                                        </div>
                                        <br/>
                                        <div class="w3-row-padding" style="margin:0 -16px">
                                            <div class="w3-half">
                                                <label for="dob" class="w3-margin-left w3-margin-bottom">Date of Birth</label>
                                            </div>
                                            <div class="w3-half">
                                                <input type="text" id="dob" name="dob" class="w3-input w3-border" th:field="*{dob}" disabled="true"/>
                                            </div>        
                                        </div>
                                        <br/>
                                        <div class="w3-row-padding" style="margin:0 -16px">
                                            <div class="w3-half">
                                                <label for="mobile" class="w3-margin-left w3-margin-bottom">Mobile</label>
                                            </div>
                                            <div class="w3-half">
                                                <input type="text" id="mobile" name="mobile" class="w3-input w3-border" th:field="*{mobile}" disabled="true"/>
                                            </div>        
                                        </div>
                                        <br/>
                                        <div class="w3-row-padding" style="margin:0 -16px">
                                            <div class="w3-half">
                                                <span>OR></span>
                                            </div>
                                            <div class="w3-half">
                                                &nbsp;
                                            </div>        
                                        </div>
                                        <br/>
                                        <div class="w3-row-padding" style="margin:0 -16px">
                                            <div class="w3-half">
                                                <label for="phone" class="w3-margin-left w3-margin-bottom">Phone</label>
                                            </div>
                                            <div class="w3-half">
                                                <input type="text" id="phone" name="phone" class="w3-input w3-border" th:field="*{phone}" disabled="true"/>
                                            </div>        
                                        </div>
                                        <br/>
                                        <div class="w3-row-padding" style="margin:0 -16px">
                                            <div class="w3-half">
                                                <label for="state" class="w3-margin-left w3-margin-bottom">State</label>
                                            </div>
                                            <div class="w3-half">
                                                <input type="text" id="state" class="w3-input w3-border" th:field="*{state.name}" disabled="true"/>
                                                <select th:field="*{stateCode}">
                                                    <option th:each="*{statesDto}" th:value="${code}" th:text="${name}">
                                                    </option>
                                                </select>
                                            </div>        
                                        </div>
                                        <br/>
                                        <div class="w3-row-padding" style="margin:0 -16px">
                                            <div class="w3-half">
                                                <label for="lokSabha" class="w3-margin-left w3-margin-bottom">Lok Sabha</label>
                                            </div>
                                            <div class="w3-half">
                                                <input type="text" id="lokSabha" class="w3-input w3-border" th:field="*{lokSabhaConstituency}" disabled="true"/>
                                            </div>        
                                        </div>
                                        <br/>
                                        <div class="w3-row-padding" style="margin:0 -16px">
                                            <div class="w3-half">
                                                <label for="vidhanSabha" class="w3-margin-left w3-margin-bottom">Vidhan Sabha</label>
                                            </div>
                                            <div class="w3-half">
                                                <input type="text" id="vidhanSabha" class="w3-input w3-border" th:field="*{vidhanSabhaConstituency}" disabled="true"/>
                                            </div>        
                                        </div>
                                        <br/>
                                        <div class="w3-row-padding" style="margin:0 -16px">
                                            <div class="w3-half">
                                                <label for="profileImg" class="w3-margin-left w3-margin-bottom">Profile Image</label>
                                            </div>
                                            <div class="w3-half">
                                                
                                                <input type="file" name="profileImg" accept="image/*" class="w3-input" th:field="*{profileFile}">
                                                <small>Max Size is 1MB</small>
                                            </div>        
                                        </div>
                                        <br/>
                                        <div class="w3-row-padding" style="margin:0 -16px">
                                            <div class="w3-half w3-center">
                                                <button type="reset" value="Reset" class="w3-button w3-theme-d1 w3-margin-left w3-margin-bottom">Reset</button>
                                            </div>
                                            <div class="w3-half w3-center">
                                                <button type="submit" class="w3-button w3-theme-d1 w3-margin-left w3-margin-bottom">Submit</button>
                                            </div>        
                                        </div>
                                        <br/>
                                    </form>
                                </div>
                            </div>
                        </div>
            </div>
        </div>
                
                <div th:insert="~{right :: copy}">
                </div>

            </div>
        </div>
            <br/>
    
    <div th:insert="~{footer :: foot}">
    </div>

</body>
</html>
