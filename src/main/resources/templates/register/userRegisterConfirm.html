<!DOCTYPE html>
<html lang="en" xmlns:th="http://www/thymeleaf.org">
    <head>
        <title>User Register Confirm</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
        <link rel="stylesheet" href="https://www.w3schools.com/lib/w3-theme-blue-grey.css">
		<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
		<style>
		html, body, h1, h2, h3, h4, h5 {
			font-family: "Open Sans", sans-serif
		}
		</style>
		<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

	</head>
    <body>
    	<!-- Navigation /header -->
    	<div  class="w3-container w3-round-large">
    		<div class="w3-panel">
    			<div th:insert="~{fragments/header::head}" ></th:insert>
    			</div>
    		</div>
         </div>
        <!-- Navigation /header -->


        <!-- Central Part / Left Content and Right stuff -->
        <div class="w3-container w3-content" style="max-width:1400px;margin-top:10px">    
            <!-- The Grid -->
            <div class="w3-row">
                <!-- Left Column -->
                <div class="w3-col m2">
                Left Column
                </div>
                <!-- End Left Column -->
                <!-- Central Part -->
             	<div class="w3-col m8">
                <h2>User Registration - Confirm</h2>
                <form th:action="@{/registerUserConfirm}" method="post" enctype="multipart/form-data" th:object=${userDto}>
                <table class="w3-table">
                <tr>
                <td><label for="email">Email:</label></td>
                <td><span id="email" th:text="*{email}" ></span>
                </td>
                </tr>
                <tr>
                <td><label for="firstName">First Name:</label></td>
                <td><span id="firstName" th:text="*{firstName}"></span>
                </td>
                </tr>
                
                <tr>
                <td><label for="lastName">Last Name:</label></td>
                <td><span id="lastName" th:text="*{lastName}"></span>
                </td>
                </tr>
                
                <tr>
                <td><label for="gender">Gender:</label></td>
                <td>
                <span id="gender" th:text="*{gender}"></span>
                </td>
                </tr>
                
                <tr>
                <td><label for="dob">Date of Birth:</label></td>
                <td><span id="dob" th:text="*{dob}"></span>
                </td>
                </tr>
                
                <tr>
                <td><label for="mobile">Mobile Number:</label></td>
                <td><span id="mobile" th:text="*{mobile}"></span>
                </td>
                </tr>
                
                <tr>
                <td><span>OR</span></td>
                <td>&nbsp;</td>
                </tr>
                
                <tr>
                <td><label for="phone">Phone/Land line Number:</label></td>
                <td><span id="phone" th:text="*{phone}"></span>
                </td>
                </tr>
                
                <tr>
                <td><label for="profile">Profile File:</label></td>
                <td><img id="profile" th:src="@{/images/UserProfileImage}" width="50" height="50"></img>
                </td>
                </tr>
                
                <tr>
                <td><label for="stateName">State:</label></td>
                <td><span id="stateName" th:text="*{stateName}"></span>
                </td>
                </tr>
                
                <tr>
                <td><label for="lokSabha">Lok Sabha:</label></td>
                <td><span id="lokSabha" th:text="*{lokSabhaConstituency}"></span>
                </td>
                </tr>
                
                <tr>
                <td><label for="vidhanSabha">Vidhan Sabha:</label></td>
                <td><span id="vidhanSabha" th:text="*{vidhanSabhaConstituency}"></span>
                </td>
                </tr>
                <tr>
                <td>
                <form th:action="@{/amendRegistration}" method="post">
							<button type="submit">Amend Details</button>
				</form>
				</td>
                <td>
                <form th:action="@{/confirmRegistration}" method="post">
							<button type="submit">Confirm Registration</button>
				</form>
				</td>
                </tr>
                
                </table>
				</form>
				</div>
				<!-- End Central Part -->
                <!-- Right Part -->
             <div class="w3-col m2">
             Right Column
             </div>
                <!-- End Right Part -->
                
                
             </div>

        </div>
        <br>

        


    </body>
</html>
